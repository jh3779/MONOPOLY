<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주류마블 - Blue Marble Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans select-none">

    <div id="app" class="max-w-3xl mx-auto min-h-screen relative shadow-2xl bg-white flex flex-col">
        
        <div id="setup-screen" class="p-6 flex flex-col h-screen justify-center hidden z-20 bg-white absolute inset-0">
            <h1 class="text-3xl font-bold text-center text-indigo-700 mb-8">🍾 주류마블<br><span class="text-sm text-gray-500 font-normal">Blue Marble Style</span></h1>
            
            <div id="setup-resume-area" class="mb-6 hidden">
                <button id="btn-resume" class="w-full bg-green-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-green-700 mb-2">
                    이어하기 (저장된 게임)
                </button>
                <div class="text-center text-gray-400 text-xs">- 또는 -</div>
            </div>

            <div class="bg-gray-50 p-4 rounded-xl border mb-6">
                <label class="block text-sm font-bold mb-2">총 인원 수 (2~8명)</label>
                <input type="number" id="input-player-count" min="2" max="8" value="4" class="w-full p-2 border rounded text-center text-lg mb-4">
                
                <label class="block text-sm font-bold mb-2">팀 개수 (2~4팀)</label>
                <select id="select-team-count" class="w-full p-2 border rounded text-center text-lg">
                    <option value="2">2팀 (Red vs Blue)</option>
                    <option value="3">3팀 (RGB)</option>
                    <option value="4">4팀 (RGBY)</option>
                </select>
            </div>

            <button id="btn-new-game" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-indigo-700">
                새 게임 시작
            </button>
        </div>

        <div id="game-screen" class="flex flex-col h-full hidden">
            <header class="p-3 bg-white shadow-sm flex justify-between items-center z-10">
                <span class="font-bold text-indigo-800">Liquor Marble</span>
                <button id="btn-reset" class="text-xs text-red-500 underline">Reset</button>
            </header>

            <div id="turn-banner" class="mx-3 mt-3 p-3 bg-white border-l-8 rounded-lg shadow-md flex justify-between items-center transition-all duration-300">
                <div>
                    <p class="text-xs text-gray-500">Current Turn</p>
                    <h2 id="current-team-name" class="text-lg font-bold">Team Name</h2>
                </div>
                <div id="dice-area">
                    </div>
            </div>

            <div class="flex-1 p-3 flex justify-center items-center bg-green-50 overflow-hidden">
                <div id="board-container" class="board-grid w-full max-w-[min(100vw-2rem,80vh)] relative"></div>
            </div>

            <div id="team-status-bar" class="bg-white border-t p-2 grid grid-cols-4 gap-2 text-xs text-center shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-10">
                </div>
        </div>

        <div id="modal-overlay" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden transform transition-all scale-100">
                <div class="bg-gray-100 p-4 border-b">
                    <h3 id="modal-title" class="font-bold text-gray-800 text-lg">Tile Name</h3>
                </div>
                <div class="p-8 flex flex-col items-center text-center">
                    <div class="w-20 h-20 bg-gray-200 rounded-lg border-2 border-dashed border-gray-400 flex items-center justify-center mb-4">
                        <img id="modal-image" class="w-full h-full object-cover rounded hidden" alt="">
                        <span id="modal-image-placeholder" class="text-gray-400 text-xs">No Image</span>
                    </div>
                    <p id="modal-content" class="text-gray-600 font-medium mb-2">빈칸 (Placeholder)</p>
                    <p id="modal-subtext" class="text-xs text-gray-400">이곳에 타일별 콘텐츠가 표시됩니다.</p>
                    <p id="modal-penalty" class="text-xs text-red-500 hidden"></p>
                </div>
                <button id="btn-modal-confirm" class="w-full py-4 bg-blue-600 text-white font-bold hover:bg-blue-700 text-lg">
                    확인 (턴 종료)
                </button>
            </div>
        </div>

    </div>

    
    <script src="app.js" defer></script>
</body>
</html>
